name: Build webOS IPK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch CLI and build IPK
        run: npm run release

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwaiting-webos-ipk
          path: release/*.ipk
          if-no-files-found: error
